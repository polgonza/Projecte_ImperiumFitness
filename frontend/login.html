<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Imperium Fitness</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="assets/logo.png" alt="Imperium">
        <span class="text-gold">IMPERIUM</span>
      </div>

      <h2 data-i18n="login.titol">Benvingut</h2>
      <p class="subtitle" data-i18n="login.subtitol">Accedeix al teu compte per reservar i comprar</p>

      <div id="login-alert" class="alert"></div>

      <form id="login-form">
        <div class="field-group">
          <label for="login-email" data-i18n="login.email">Correu electrònic</label>
          <input type="email" id="login-email" class="input-field" placeholder="tu@email.com" required>
        </div>

        <div class="field-group">
          <label for="login-password" data-i18n="login.contrasenya">Contrasenya</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
            <button type="button" class="toggle-password" data-target="login-password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary"
          style="width:100%;justify-content:center;padding:0.85rem;margin-top:0.5rem"
          data-i18n="login.entrar">
          Entrar
        </button>
      </form>

      <div class="auth-links" style="margin-top:1rem">
        <a href="recover.html" data-i18n="login.oblidat">Has oblidat la contrasenya?</a>
      </div>
      <div class="auth-links">
        <span data-i18n="login.noCompte">No tens compte?</span>
        <a href="register.html" data-i18n="login.registrat">Registra't</a>
      </div>
      <div class="auth-links">
        <a href="index.html" data-i18n="login.tornar">← Tornar a l'inici</a>
      </div>

    </div>
  </div>

  <!-- ORDRE IMPORTANT: api.js sempre PRIMER -->
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script src="js/carrito.js"></script>

<script>
  // Mostra el missatge de sessió expirada si existeix
 document.addEventListener("DOMContentLoaded", function() {
  I18n.init();  
  SessionManager.init(false);
    
    // Fragment suggerit per assistent IA - revisar i adaptar
  const sessionMsg = sessionStorage.getItem("session_msg");
  if (sessionMsg) {
    const alertEl = document.getElementById("login-alert");
    if (alertEl) {
      alertEl.textContent = sessionMsg;
      alertEl.className = "alert error show";
    }
    sessionStorage.removeItem("session_msg");
  }
});
</script>
</body>

</html>
